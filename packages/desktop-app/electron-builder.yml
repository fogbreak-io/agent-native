appId: io.fogbreak.desktop
productName: Fogbreak

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - "!node_modules/**"
  - node_modules/node-pty/**
  - "!src/**"
  - "!shared/**"
  - "!electron.vite.config.*"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.*.json}"

asarUnpack:
  - node_modules/node-pty/prebuilds/**

extraResources:
  - from: ../agent-chrome-extension/dist
    to: chrome-extension

protocols:
  - name: Fogbreak
    schemes:
      - fogbreak

mac:
  files:
    - "!node_modules/node-pty/build/**"
  extraResources:
    - from: native/bin/agent-native-computer-helper
      to: native/agent-native-computer-helper
    - from: build/fogbreak/Assets.car
      to: Assets.car
  category: public.app-category.developer-tools
  icon: build/fogbreak/icon.icns
  extendInfo:
    CFBundleIconName: fogbreak
    NSMicrophoneUsageDescription: Fogbreak uses your microphone for dictation and realtime voice conversations.
    NSCameraUsageDescription: Fogbreak uses your camera for video capture in apps like Clips.
    NSScreenCaptureUsageDescription: Fogbreak records your screen when you start a recording in apps like Clips.
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  artifactName: ${productName}-${arch}.${ext}

# No publisher is configured until the owned release route is verified.
publish: null
forceCodeSigning: true

npmRebuild: false
