<title>Fogbreak Control Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: status bar on top, a horizontal strip of session tabs under it, one detail panel below the strip. */
:root {
  --bg: #0e1417;
  --surface: #151d21;
  --surface-2: #1b252a;
  --line: #28353c;
  --fg: #e4edf0;
  --muted: #92a5ad;
  --accent: #5cc8d6;
  --accent-ink: #062a30;
  --good: #5fd08a;
  --warn: #e8b04a;
  --bad: #f0705f;
  --calm: #8fa6c4;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef3f4; --surface: #ffffff; --surface-2: #e5edef; --line: #c9d7dc;
    --fg: #12212a; --muted: #4f656c; --accent: #0a7d8c; --accent-ink: #ffffff;
    --good: #17794a; --warn: #8f5a00; --bad: #b3372b; --calm: #4c6385;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef3f4; --surface: #ffffff; --surface-2: #e5edef; --line: #c9d7dc;
  --fg: #12212a; --muted: #4f656c; --accent: #0a7d8c; --accent-ink: #ffffff;
  --good: #17794a; --warn: #8f5a00; --bad: #b3372b; --calm: #4c6385;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.wrap > * { min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-size: 12.5px; letter-spacing: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* status bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.bar h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.badge { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border-radius: 3px; font-family: var(--font-data); font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.badge.live { color: var(--good); }
.badge.live i { animation: pulse 2s ease-in-out infinite; }
.badge.snap { color: var(--warn); }
.badge.err { color: var(--bad); }
.badge.wait { color: var(--muted); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .badge.live i { animation: none; } }
.asof { color: var(--muted); font-size: 13.5px; min-width: 0; }
.asof b { color: var(--fg); font-weight: 500; }
.spacer { flex: 1 1 0; }
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; font-size: 13.5px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; text-decoration: none; display: inline-block; }

.alert { border: 1px solid var(--bad); border-left-width: 4px; background: var(--surface); border-radius: 4px; padding: 10px 14px; display: grid; gap: 2px; }
.alert strong { color: var(--bad); font-family: var(--font-display); font-size: 16px; letter-spacing: .02em; }
.alert.warn { border-color: var(--warn); } .alert.warn strong { color: var(--warn); }
.alert p { margin: 0; color: var(--muted); font-size: 14px; }
.alert .mono { color: var(--fg); overflow-wrap: anywhere; }

/* session strip */
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.strip::-webkit-scrollbar { height: 8px; }
.strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.tab { flex: 0 0 248px; min-width: 0; scroll-snap-align: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--calm)); border-radius: 4px; padding: 10px 12px 11px; display: grid; gap: 6px; align-content: start; }
.tab:hover { border-color: var(--accent); border-top-color: var(--tone, var(--calm)); }
.tab[aria-selected="true"] { background: var(--surface-2); border-color: var(--accent); border-top-color: var(--tone, var(--calm)); box-shadow: 0 0 0 1px var(--accent); }
.tab .t { font-weight: 500; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; overflow-wrap: anywhere; }
.tab .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tone-working { --tone: var(--good); } .tone-blocked { --tone: var(--warn); }
.tone-failed { --tone: var(--bad); } .tone-completed { --tone: var(--calm); } .tone-other { --tone: var(--muted); }
.chip { font-family: var(--font-data); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--tone, var(--muted)); }
.stale-pill { font-family: var(--font-data); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 3px; padding: 0 5px; }
.stamp { font-family: var(--font-data); font-size: 12px; color: var(--muted); display: grid; gap: 1px; }
.stamp b { color: var(--fg); font-weight: 500; }
.tab.stale .stamp b, .tab.stale .t { color: var(--muted); }
.tab.stale { background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--warn) 7%, transparent) 7px 8px); }
.skel { height: 96px; flex: 0 0 248px; border-radius: 4px; background: linear-gradient(90deg, var(--surface), var(--surface-2), var(--surface)); background-size: 200% 100%; animation: sh 1.4s linear infinite; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

/* panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.panel header { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 16px; }
.panel h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 0; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.panel .idline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.panel .idline .mono { overflow-wrap: anywhere; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
h3 { font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 14px; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.events { display: grid; gap: 8px; }
.ev { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; display: grid; gap: 2px; min-width: 0; }
.ev.assistant { border-left-color: var(--accent); }
.ev .meta { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.ev .txt { font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow: hidden; }
.empty { border: 1px dashed var(--line); border-radius: 4px; padding: 14px; color: var(--muted); font-size: 14px; }
.hero-err { border: 1px solid var(--bad); border-radius: 4px; padding: 22px 18px; background: var(--surface); display: grid; gap: 6px; }
.hero-err strong { font-family: var(--font-display); font-size: 20px; color: var(--bad); }
.hero-err p { margin: 0; color: var(--muted); max-width: 70ch; }
.foot { color: var(--muted); font-size: 12.5px; }
</style>

<div class="wrap">
  <div class="bar" id="bar">
    <h1>Control Room</h1>
    <span id="badge" class="badge wait"><i></i><span>Connecting</span></span>
    <span id="asof" class="asof"></span>
    <span class="spacer"></span>
    <button id="refresh" class="btn" type="button" disabled>Refresh now</button>
  </div>
  <div id="alerts" style="display:grid;gap:10px"></div>
  <div id="stripWrap"><div class="strip" id="strip" role="tablist" aria-label="Sessions, most recently updated first"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
  <section class="panel" id="panel" aria-live="polite" hidden></section>
  <div class="foot" id="foot">Sessions come from Claude Code Remote for the account that opened this page. Rows older than 15 minutes are marked stale.</div>
</div>

<script>
(function () {
  "use strict";
  var SERVER = "Claude Code Remote";
  var STALE_MS = 15 * 60 * 1000;
  var NO_ANSWER_MS = 12000;
  var $ = function (id) { return document.getElementById(id); };

  var state = {
    live: null,      // {sessions, asOf} from the connector
    snap: null,      // {sessions, asOf, hasMore} stored by Claude in the page database
    error: null,     // {code, message} from the live feed, null when healthy
    mcp: null,
    selected: null,
    settled: false,
    events: {}       // sessionId -> {status, items, error}
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- time ---------- */
  function ms(iso) { var t = Date.parse(iso); return isFinite(t) ? t : null; }
  function ago(t) {
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + " s ago";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min ago";
    return Math.floor(s / 86400) + " d " + Math.floor((s % 86400) / 3600) + " h ago";
  }
  function clock(t) {
    var d = new Date(t), today = new Date();
    var time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    var day = d.toDateString() === today.toDateString() ? "" : d.toLocaleDateString([], { day: "2-digit", month: "short" }) + " ";
    return day + time;
  }
  function zone() {
    try { return new Date().toLocaleTimeString([], { timeZoneName: "short" }).split(" ").pop(); } catch (e) { return ""; }
  }

  /* ---------- data normalisation ---------- */
  function bucketOf(raw) {
    var b = String(raw || "").replace("SESSION_STATUS_BUCKET_", "").toLowerCase();
    return ["working", "blocked", "failed", "completed", "review_ready"].indexOf(b) >= 0 ? b : "other";
  }
  function normalise(r) {
    var psum = r.post_turn_summary || {};
    return {
      id: String(r.id || ""),
      title: String(r.title || "Untitled session"),
      status: String(r.session_status || "").replace("SESSION_STATUS_", "").toLowerCase() || "unknown",
      bucket: bucketOf(r.status_bucket),
      created: ms(r.created_at),
      updated: ms(r.updated_at),
      summary: r.task_summary || psum.recent_action || "",
      needs: psum.needs_action || "",
      env: r.environment_kind || "",
      origin: r.origin || ""
    };
  }
  // Returns an array of raw sessions, or throws when the payload is not recognisable.
  function extractList(payload) {
    var p = payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { throw new Error("the answer was text, not JSON"); } }
    var arr = Array.isArray(p) ? p : (p && p.ccr && p.ccr.data) || (p && p.data) || (p && p.sessions);
    if (!Array.isArray(arr)) throw new Error("the answer had no session list");
    return arr;
  }

  /* ---------- rendering ---------- */
  function current() { return state.live || state.snap || null; }

  function renderBar() {
    var cur = current(), badge = $("badge"), asof = $("asof");
    var kind, label;
    if (state.error && !state.live) { kind = "err"; label = "No live feed"; }
    else if (state.error) { kind = "err"; label = "Feed failed"; }
    else if (state.live) { kind = "live"; label = "Live"; }
    else if (state.snap) { kind = "snap"; label = "Snapshot"; }
    else if (state.settled) { kind = "err"; label = "No data"; }
    else { kind = "wait"; label = "Connecting"; }
    badge.className = "badge " + kind;
    badge.lastChild.textContent = label;
    asof.textContent = "";
    if (cur) {
      var stale = cur.sessions.filter(function (s) { return s.updated == null || Date.now() - s.updated > STALE_MS; }).length;
      var working = cur.sessions.filter(function (s) { return s.bucket === "working"; }).length;
      var b = el("b", "tnum", "Data as of " + clock(cur.asOf) + " " + zone());
      asof.appendChild(b);
      asof.appendChild(document.createTextNode(" (" + ago(cur.asOf) + ") · " + cur.sessions.length + " sessions" + (cur.hasMore ? " shown" : "") + " · " + working + " working · " + stale + " stale"));
    } else {
      asof.textContent = state.settled ? "Nothing to show." : "Waiting for the session feed…";
    }
    $("refresh").disabled = !state.mcp;
  }

  function renderAlerts() {
    var box = $("alerts"); box.textContent = "";
    if (state.error) {
      var a = el("div", "alert"); a.setAttribute("role", "alert");
      a.appendChild(el("strong", null, state.live ? "Live feed stopped updating" : "Live feed unavailable"));
      var p = el("p", null, state.error.message + " ");
      var code = el("span", "mono", "[" + state.error.code + "]");
      p.appendChild(code);
      a.appendChild(p);
      var tail = state.live
        ? "Showing the last rows received at " + clock(state.live.asOf) + ". Treat them as old."
        : state.snap
          ? "Showing a stored snapshot taken " + clock(state.snap.asOf) + " (" + ago(state.snap.asOf) + "). It is not live."
          : "There is no stored snapshot to fall back on.";
      a.appendChild(el("p", null, tail));
      box.appendChild(a);
    } else if (!state.live && state.snap) {
      var w = el("div", "alert warn");
      w.appendChild(el("strong", null, "Waiting for the live feed"));
      w.appendChild(el("p", null, "Showing a stored snapshot taken " + clock(state.snap.asOf) + " (" + ago(state.snap.asOf) + ") until the connector answers."));
      box.appendChild(w);
    }
  }

  function toneClass(s) { return "tone-" + (s.bucket === "review_ready" ? "completed" : s.bucket); }

  function renderStrip() {
    var strip = $("strip"), cur = current();
    var keep = strip.scrollLeft;
    strip.textContent = "";
    if (!cur) {
      if (state.settled) {
        var h = el("div", "hero-err"); h.style.flex = "1 1 100%";
        h.appendChild(el("strong", null, "No sessions to show"));
        h.appendChild(el("p", null, "The live feed did not answer and there is no stored snapshot. This is a failure, not an empty account."));
        strip.appendChild(h);
      } else {
        for (var i = 0; i < 4; i++) strip.appendChild(el("div", "skel"));
      }
      return;
    }
    if (cur.sessions.length === 0) {
      var e = el("div", "empty", "The connector answered with zero sessions for this account.");
      e.style.flex = "1 1 100%";
      strip.appendChild(e);
      return;
    }
    cur.sessions.forEach(function (s) {
      var isStale = s.updated == null || Date.now() - s.updated > STALE_MS;
      var b = el("button", "tab " + toneClass(s) + (isStale ? " stale" : ""));
      b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(s.id === state.selected));
      b.dataset.id = s.id;
      b.appendChild(el("span", "t", s.title));
      var r1 = el("span", "row");
      r1.appendChild(el("span", "chip", s.bucket.replace("_", " ") + " · " + s.status));
      if (isStale) r1.appendChild(el("span", "stale-pill", "stale"));
      b.appendChild(r1);
      var st = el("span", "stamp");
      var l1 = el("span"); l1.appendChild(document.createTextNode("updated ")); l1.appendChild(el("b", "tnum", s.updated ? clock(s.updated) : "unknown"));
      st.appendChild(l1);
      st.appendChild(el("span", "tnum", s.updated ? ago(s.updated) : "no timestamp from source"));
      b.appendChild(st);
      b.addEventListener("click", function () { select(s.id); });
      strip.appendChild(b);
    });
    strip.scrollLeft = keep;
  }

  function dd(dl, k, v) { dl.appendChild(el("dt", null, k)); var d = el("dd"); if (v instanceof Node) d.appendChild(v); else d.textContent = v; dl.appendChild(d); }

  function renderPanel() {
    var panel = $("panel"), cur = current();
    var s = cur && cur.sessions.filter(function (x) { return x.id === state.selected; })[0];
    if (!s) { panel.hidden = true; panel.textContent = ""; return; }
    panel.hidden = false; panel.textContent = "";
    var isStale = s.updated == null || Date.now() - s.updated > STALE_MS;

    var head = el("header");
    var left = el("div"); left.style.cssText = "display:grid;gap:6px;flex:1 1 320px;min-width:0";
    left.appendChild(el("h2", null, s.title));
    var idl = el("div", "idline");
    idl.appendChild(el("span", "mono", s.id));
    var copy = el("button", "btn", "Copy id"); copy.type = "button";
    copy.addEventListener("click", function () {
      try { navigator.clipboard.writeText(s.id).then(function () { copy.textContent = "Copied"; }, function () { copy.textContent = "Select the id and copy"; }); }
      catch (e) { copy.textContent = "Select the id and copy"; }
    });
    idl.appendChild(copy);
    left.appendChild(idl);
    head.appendChild(left);
    var open = el("a", "btn primary", "Open session in Claude");
    open.href = "https://claude.ai/code/" + encodeURIComponent(s.id);
    open.target = "_blank"; open.rel = "noopener noreferrer";
    head.appendChild(open);
    panel.appendChild(head);

    var cols = el("div", "cols");
    var a = el("div");
    a.appendChild(el("h3", null, "Session record"));
    var dl = el("dl");
    dd(dl, "State", s.bucket.replace("_", " ") + " · " + s.status);
    dd(dl, "Last updated", s.updated ? clock(s.updated) + " " + zone() + " · " + ago(s.updated) + (isStale ? " · STALE" : "") : "no timestamp from source");
    dd(dl, "Started", s.created ? clock(s.created) + " " + zone() : "unknown");
    dd(dl, "Summary", s.summary || "The source gave no summary for this session.");
    if (s.needs) dd(dl, "Needs action", s.needs);
    if (s.env) dd(dl, "Environment", s.env + (s.origin ? " · " + s.origin : ""));
    a.appendChild(dl);
    a.appendChild(el("p", "note", "Artifact pages cannot embed other sites, so the full session opens in a new tab and its latest messages are shown here."));
    a.lastChild.style.marginTop = "12px";
    cols.appendChild(a);

    var b = el("div");
    b.appendChild(el("h3", null, "Latest messages"));
    b.appendChild(eventsNode(s));
    cols.appendChild(b);
    panel.appendChild(cols);
  }

  function eventsNode(s) {
    var ev = state.events[s.id], box = el("div", "events");
    if (!state.mcp) {
      box.appendChild(el("div", "empty", "Messages are read live from Claude Code Remote, and the connector is not available in this view. Use the open button to read the session."));
      return box;
    }
    if (!ev || ev.status === "loading") {
      for (var i = 0; i < 3; i++) { var k = el("div", "skel"); k.style.cssText = "height:56px;flex:none"; box.appendChild(k); }
      return box;
    }
    if (ev.status === "error") {
      var a = el("div", "alert"); a.setAttribute("role", "alert");
      a.appendChild(el("strong", null, "Could not read this session's messages"));
      var p = el("p", null, ev.error.message + " "); p.appendChild(el("span", "mono", "[" + ev.error.code + "]")); a.appendChild(p);
      var retry = el("button", "btn", "Try again"); retry.type = "button"; retry.style.justifySelf = "start"; retry.style.marginTop = "6px";
      retry.addEventListener("click", function () { loadEvents(s.id, true); });
      a.appendChild(retry);
      box.appendChild(a);
      return box;
    }
    if (ev.items.length === 0) {
      box.appendChild(el("div", "empty", "The connector answered but returned no user or assistant messages for this session."));
      return box;
    }
    ev.items.forEach(function (m) {
      var d = el("div", "ev " + m.role);
      var meta = el("div", "meta");
      meta.appendChild(el("span", null, m.role));
      meta.appendChild(el("span", "tnum", m.at ? clock(m.at) + " · " + ago(m.at) : "no timestamp"));
      if (m.synthetic) meta.appendChild(el("span", null, "automatic"));
      d.appendChild(meta);
      d.appendChild(el("div", "txt", m.text));
      box.appendChild(d);
    });
    var f = el("p", "note", "Read at " + clock(ev.fetchedAt) + ". Newest first, at most 8 messages.");
    box.appendChild(f);
    return box;
  }

  function renderAll() { renderBar(); renderAlerts(); renderStrip(); renderPanel(); }

  /* ---------- selection and events ---------- */
  function select(id) {
    state.selected = id;
    try { sessionStorage.setItem("fcr-selected", id); } catch (e) {}
    renderStrip(); renderPanel();
    if (state.mcp) loadEvents(id, false);
    var p = $("panel"); if (p.scrollIntoView) { try { p.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {} }
  }

  function textOf(content) {
    if (typeof content === "string") return content;
    if (!Array.isArray(content)) return "";
    return content.map(function (c) { return c && c.type === "text" && c.text ? c.text : ""; }).filter(Boolean).join("\n");
  }
  function parseEvents(payload) {
    var p = payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { throw new Error("the answer was text, not JSON"); } }
    var arr = Array.isArray(p) ? p : (p && p.ccr && p.ccr.data) || (p && p.data);
    if (!Array.isArray(arr)) throw new Error("the answer had no event list");
    var out = [];
    arr.forEach(function (e) {
      var role = e.assistant ? "assistant" : e.user ? "user" : null;
      if (!role) return;
      var body = e[role] || {};
      var msg = (body.internal_anthropic_catchall && body.internal_anthropic_catchall.message) || body.message || {};
      var text = textOf(msg.content).trim();
      if (!text) return;
      if (text.length > 700) text = text.slice(0, 700) + "…";
      out.push({ role: role, text: text, at: ms(e.created_at), synthetic: !!(body.internal_anthropic_catchall && body.internal_anthropic_catchall.isSynthetic) });
    });
    out.sort(function (x, y) { return (y.at || 0) - (x.at || 0); });
    return out.slice(0, 8);
  }
  function errOf(e) {
    return { code: (e && e.code) || "error", message: (e && e.message) || String(e) };
  }
  function loadEvents(id, force) {
    if (!state.mcp) return;
    var cached = state.events[id];
    if (!force && cached && cached.status === "ok" && Date.now() - cached.fetchedAt < 20000) return;
    state.events[id] = { status: "loading" };
    if (state.selected === id) renderPanel();
    state.mcp.callTool(SERVER, "list_events", { session_id: id, kinds: ["user", "assistant"], limit: 100 }, { cache: { staleTime: 15000, gcTime: 60000 } })
      .then(function (res) {
        var items = parseEvents(res.payload);
        state.events[id] = { status: "ok", items: items, fetchedAt: (res.cache && res.cache.storedAt) || Date.now() };
      })
      .catch(function (e) { state.events[id] = { status: "error", error: errOf(e) }; })
      .then(function () { if (state.selected === id) renderPanel(); });
  }

  /* ---------- feeds ---------- */
  function onLive(res) {
    var raw;
    try { raw = extractList(res.payload); }
    catch (e) { state.error = { code: "unreadable_answer", message: "The connector answered, but " + e.message + "." }; state.settled = true; renderAll(); return; }
    var sessions = raw.map(normalise).filter(function (s) { return s.id; });
    sessions.sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
    var meta = res.payload && res.payload.ccr;
    state.live = { sessions: sessions, asOf: (res.cache && res.cache.storedAt) || Date.now(), hasMore: !!(meta && meta.has_more) };
    state.error = null; state.settled = true;
    afterData();
  }
  function onLiveError(e) {
    state.error = errOf(e); state.settled = true;
    afterData();
  }
  function afterData() {
    var cur = current();
    if (cur && (!state.selected || !cur.sessions.some(function (s) { return s.id === state.selected; }))) {
      var remembered = null;
      try { remembered = sessionStorage.getItem("fcr-selected"); } catch (e) {}
      var pick = cur.sessions.filter(function (s) { return s.id === remembered; })[0] || cur.sessions[0];
      state.selected = pick ? pick.id : null;
      if (state.selected && state.mcp) loadEvents(state.selected, false);
    }
    renderAll();
  }

  function startLive(mcp) {
    state.mcp = mcp;
    mcp.watchTool(SERVER, "list_sessions", { limit: 30 }, function (ev) {
      if (ev.type === "data") onLive(ev.result); else onLiveError(ev.error);
    }, { refetchInterval: 30000, cache: { staleTime: 0, gcTime: 60000 } });
    $("refresh").addEventListener("click", function () {
      var btn = $("refresh"); btn.disabled = true; btn.textContent = "Refreshing…";
      mcp.invalidate(SERVER, "list_sessions").catch(function () {}).then(function () {
        setTimeout(function () { btn.textContent = "Refresh now"; btn.disabled = false; }, 1500);
      });
      if (state.selected) loadEvents(state.selected, true);
    });
  }

  function loadSnapshot(db) {
    db.collection("snapshots").doc("latest").get().then(function (snap) {
      if (!snap.exists) return;
      var d = snap.data() || {};
      if (!Array.isArray(d.sessions)) return;
      var sessions = d.sessions.map(normalise).filter(function (s) { return s.id; });
      sessions.sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
      var at = ms(d.fetchedAt);
      if (at == null) return;   // a snapshot without a fetch time cannot be shown truthfully
      state.snap = { sessions: sessions, asOf: at, hasMore: !!d.hasMore };
      afterData();
    }).catch(function () { /* the live feed or the error state covers this */ });
  }

  function boot() {
    renderAll();
    var cl = window.claude;
    if (!cl || typeof cl.use !== "function") {
      state.error = { code: "no_runtime", message: "This page is not running inside claude.ai, so it has no connector or stored data. Open the artifact link while signed in to claude.ai." };
      state.settled = true; renderAll(); return;
    }
    var pending = 2;
    function done() { pending--; }
    cl.use("mcp").then(function (mcp) {
      if (mcp) startLive(mcp);
      else { state.error = { code: "connector_unavailable", message: "The Claude Code Remote connector is not available in this view." }; state.settled = true; afterData(); }
    }).catch(function (e) { state.error = errOf(e); state.settled = true; afterData(); }).then(done);
    cl.use("db").then(function (db) { if (db) loadSnapshot(db); }).catch(function () {}).then(done);

    setTimeout(function () {
      if (!state.live && !state.snap && !state.error) {
        state.error = { code: "no_answer", message: "Nothing answered within " + (NO_ANSWER_MS / 1000) + " seconds." };
        state.settled = true; renderAll();
      }
    }, NO_ANSWER_MS);
  }

  // Keep ages and stale marks truthful between feed updates.
  setInterval(function () { renderBar(); renderAlerts(); renderStrip(); renderPanel(); }, 10000);
  boot();
})();
</script>
